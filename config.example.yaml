interval: 3 # Interval between pollings
loglevel: 5 # 1-5
concurrent_limit: 1 # Hard cap on workers running at the same time
# Prometheus metrics are exposed at http://exporter_address/metrics
exporter_address: :8081
checkpoint: checkpoint.json

# Elastic admission control: gates job launches on host memory pressure and
# learned per-repo memory budgets (peak-memory EWMA from past runs).
# IO is deliberately not an admission signal: a mirror host is IO-saturated
# by design, and gating on it would starve the queue.
# Requires cgroup v2 with a delegated subtree for full effect; concurrent_limit
# above always applies as a hard cap on top.
admission:
    enabled: false # false: only concurrent_limit applies
    mem_reserve_fraction: 0.2 # keep this fraction of available memory free
    mem_psi_threshold: 15 # defer launches when memory some/avg10 exceeds this

#logstash:
#   address: listener.logz.io:5050 # logstash sink. Lug will send all logs to this address
#   additional_fields:
#       token: "" # Additional fields sent to logstash server

# Address where JSON API will be served
json_api:
    address: :7001

repos:
    - type: shell_script
      script: rsync -av rsync://rsync.chiark.greenend.org.uk/ftp/users/sgtatham/putty-website-mirror/ /tmp/putty
      name: putty
      interval: 600
      # Optional per-job resource controls (enforced via cgroup v2 when a
      # delegated subtree is available; ignored gracefully otherwise):
      # rlimit_mem: 1G # cgroup memory.max for the job; the whole job tree is OOM-killed above it
      # timeout: 7200 # wall-clock budget in seconds; the job tree is killed on expiry
    - type: shell_script
      script: bash -c 'printenv | grep ^LUG'
      name: printenv
      any_option: any_value
      any_switch: true # This will be set to 1
      any_switch_2: false # unset
      interval: 10
    - type: external
      name: ubuntu
      proxy_to: http://ftp.sjtu.edu.cn/ubuntu/
      # Since interval is not set for this target, this will only be triggered at startup
